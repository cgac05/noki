name: noki

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noki
      POSTGRES_PASSWORD: noki_demo
      POSTGRES_DB: noki
    ports:
      - '5432:5432'
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U noki -d noki']
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-datos:
